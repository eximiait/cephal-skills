<svg xmlns="http://www.w3.org/2000/svg" width="920" height="584" viewBox="0 0 920 584" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<rect width="920" height="584" rx="8" fill="#0d1117"/>
<circle cx="18" cy="16" r="5" fill="#ff5f56"/><circle cx="36" cy="16" r="5" fill="#ffbd2e"/><circle cx="54" cy="16" r="5" fill="#27c93f"/>
<text x="460" y="20" fill="#8b949e" text-anchor="middle">deploy-test</text>
<text x="16" y="44" fill="#d2a8ff" font-weight="normal" xml:space="preserve">&gt; /cephal:deploy-test</text>
<text x="16" y="64" fill="#c9d1d9" font-weight="normal" xml:space="preserve">⚠️ La versión tiene -SNAPSHOT: así no se puede pasar a testing.</text>
<text x="16" y="84" fill="#c9d1d9" font-weight="normal" xml:space="preserve">¿Quito -SNAPSHOT (2.0.0) con el commit «Release app 2.0.0»?</text>
<text x="16" y="104" fill="#d2a8ff" font-weight="normal" xml:space="preserve">&gt; sí</text>
<text x="16" y="124" fill="#e6edf3" font-weight="bold" xml:space="preserve">diff --git a/chart/Chart.yaml b/chart/Chart.yaml</text>
<text x="16" y="144" fill="#e6edf3" font-weight="bold" xml:space="preserve">index f2ec47d..1adb0c6 100644</text>
<text x="16" y="164" fill="#e6edf3" font-weight="bold" xml:space="preserve">--- a/chart/Chart.yaml</text>
<text x="16" y="184" fill="#e6edf3" font-weight="bold" xml:space="preserve">+++ b/chart/Chart.yaml</text>
<text x="16" y="204" fill="#58a6ff" font-weight="normal" xml:space="preserve">@@ -3,2 +3,2 @@ name: demo</text>
<text x="16" y="224" fill="#c9d1d9" font-weight="normal" xml:space="preserve"> version: 1.0.0</text>
<text x="16" y="244" fill="#f85149" font-weight="normal" xml:space="preserve">-appVersion: "2.0.0-SNAPSHOT"</text>
<text x="16" y="264" fill="#3fb950" font-weight="normal" xml:space="preserve">+appVersion: "2.0.0"</text>
<text x="16" y="284" fill="#e6edf3" font-weight="bold" xml:space="preserve">diff --git a/pom.xml b/pom.xml</text>
<text x="16" y="304" fill="#e6edf3" font-weight="bold" xml:space="preserve">index 10cc654..f77ed46 100644</text>
<text x="16" y="324" fill="#e6edf3" font-weight="bold" xml:space="preserve">--- a/pom.xml</text>
<text x="16" y="344" fill="#e6edf3" font-weight="bold" xml:space="preserve">+++ b/pom.xml</text>
<text x="16" y="364" fill="#58a6ff" font-weight="normal" xml:space="preserve">@@ -2,3 +2,3 @@</text>
<text x="16" y="384" fill="#c9d1d9" font-weight="normal" xml:space="preserve">   &lt;artifactId&gt;demo&lt;/artifactId&gt;</text>
<text x="16" y="404" fill="#f85149" font-weight="normal" xml:space="preserve">-  &lt;version&gt;2.0.0-SNAPSHOT&lt;/version&gt;</text>
<text x="16" y="424" fill="#3fb950" font-weight="normal" xml:space="preserve">+  &lt;version&gt;2.0.0&lt;/version&gt;</text>
<text x="16" y="444" fill="#c9d1d9" font-weight="normal" xml:space="preserve"> &lt;/project&gt;</text>
<text x="16" y="464" fill="#c9d1d9" font-weight="normal" xml:space="preserve">¿patch, minor o major sobre 1.0.0?</text>
<text x="16" y="484" fill="#d2a8ff" font-weight="normal" xml:space="preserve">&gt; minor</text>
<text x="16" y="504" fill="#c9d1d9" font-weight="normal" xml:space="preserve">Tag 1.1.0-rc.1 sobre a2d2a3b (develop). ¿Confirmás el push?</text>
<text x="16" y="524" fill="#d2a8ff" font-weight="normal" xml:space="preserve">&gt; sí</text>
<text x="16" y="544" fill="#c9d1d9" font-weight="normal" xml:space="preserve">pushed=1.1.0-rc.1</text>

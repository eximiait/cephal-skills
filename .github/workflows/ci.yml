name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas
        shell: bash
        run: sh tests/run.sh
      - name: Copias del script sincronizadas
        shell: bash
        run: sh scripts/sync.sh --check
      - name: Wrapper de PowerShell
        shell: pwsh
        run: ./tests/test_wrapper.ps1
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck -s sh -S warning scripts/cephal-version scripts/sync.sh scripts/check-version.sh
          shellcheck -s sh -S warning -e SC1090,SC1091,SC2034 tests/*.sh
